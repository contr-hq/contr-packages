name: publish

# Rebuilds the signed APT and DNF repositories and the signed checksums of every published release, and deploys them to
# GitHub Pages.
on:
  schedule:
    - cron: '17 3 * * *'
  repository_dispatch:
    types: [release]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      built: ${{ steps.key.outputs.configured }}
    env:
      SIGNING_KEY_ARMORED: ${{ secrets.PACKAGES_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Signing key
        id: key
        env:
          PASSPHRASE: ${{ secrets.PACKAGES_SIGNING_PASSPHRASE }}
        run: |
          if [[ -z "$SIGNING_KEY_ARMORED" ]]; then
            echo "::warning::Add the PACKAGES_SIGNING_KEY and PACKAGES_SIGNING_PASSPHRASE secrets to publish the repositories."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          printf '%s\n' "$SIGNING_KEY_ARMORED" | gpg --batch --quiet --import
          {
            echo "GNUPGHOME=$GNUPGHOME"
            echo "SIGNING_KEY=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
            echo "SIGNING_PASSPHRASE_FILE=$RUNNER_TEMP/passphrase"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Tools
        if: steps.key.outputs.configured == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils createrepo-c rpm
      - name: Collect the packages
        if: steps.key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/collect.sh "$RUNNER_TEMP/packages"
      - name: Build the repositories
        if: steps.key.outputs.configured == 'true'
        run: |
          scripts/build-repos.sh "$RUNNER_TEMP/packages" site
          cp pages/index.html site/
      - name: Sign every release's checksums
        if: steps.key.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/sign-checksums.sh site
      - uses: actions/upload-pages-artifact@v5
        if: steps.key.outputs.configured == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
